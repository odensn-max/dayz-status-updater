name: Update DayZ server status
on:
  schedule:
    # Toutes les 5 minutes (minimum autorise par GitHub)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permet aussi de le lancer manuellement depuis GitHub
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances
        run: pip install -r requirements.txt
      - name: Mettre a jour Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python update_status.py
      - name: TEST temporaire port Bitteroot
        run: python test_bitteroot_port.py
